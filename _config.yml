# Site settings
title: Bösger Photography
email: "photography@boesger.com"
description: "My life as a photographer"
url: "https://photography.boesger.com"
baseurl: ""
instagram_username: "phillip.bo"
share: true

# Owner/author information
owner:
  name: Phillip Bösger
  avatar: logo_photography.png
  favicon: favicon.ico
  info: photography website

# Settings for comments helper
# Set 'provider' to the comment provider you want to use. (i.e.  Disqus, Intense Debate, livefyre, or Facebook Comments)
# Set 'provider' to false to turn commenting off globally.
#Set 'provider: false' to disable comments globally.
# Disable comments for individual pages/posts by specifying 'comments: false' in the page/post YAML Front Matter.
#
comments :
  provider : false
  disqus :
    short_name : ""

# Internal nav
nav:
  - ABOUT: "https://photography.boesger.com/about/"
  - GALLERY: "https://photography.boesger.com/gallery/"  

# All translation keys
translations:
 # 404.html
  permalink: "/404.html"

# Server
destination:      	 ./_site
port:             	 4000


# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
paginate: 5
plugins:
 - jekyll-paginate

# SiteMap
sitemap:
    file: "/sitemap.xml"
    exclude:
        - "/atom.xml"
        - "/feed.xml"
        - "/feed/index.xml"
    include_posts:
        - "/writing/"
    change_frequency_name: "change_frequency"
    priority_name: "priority"

# Do not publish internal design previews or superseded about pages.
exclude:
  - less
  - node_modules
  - Gruntfile.js
  - package.json
  - README.md
  - about_preview.html
  - about_mobile_preview.html
  - about_preview_new_bg.html
  - about/index_new.html
  - about/index_old.html
